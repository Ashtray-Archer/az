name: test

on:
  pull_request:
  push:
    branches:
      - grease-amazon-prices
      - abebooks-impact-links

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install JSON tool
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Shell syntax
        run: bash -n bin/az bin/abe bin/zillow test/az-test.sh test/abe-test.sh test/zillow-test.sh
      - name: Smoke tests
        run: make test

  grease-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out canonical Grease and its exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/grease
          ref: 94d051fccf7ce6e38da90112d18cb2bf3554769f
          submodules: recursive
          path: _runtime/grease
          persist-credentials: false
      - name: Check out the canonical Cat Food build recipe
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/catfood
          ref: 1db1c1b127a7eaddce1bf1646082140b94d41727
          path: _catfood-build
          persist-credentials: false
      - name: Install runtime build and consumer test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential jq libreadline-dev libffi-dev
      - name: Build and identify the canonical Grease runtime
        id: build_runtime
        shell: sh
        run: |
          workspace="$GITHUB_WORKSPACE/_runtime"
          source_pin=$(git -C "$workspace/grease" rev-parse HEAD:source)
          test "$(git -C "$workspace/grease/source" rev-parse HEAD)" = "$source_pin"
          CATFOOD_ROOT="$workspace" sh _catfood-build/build-tools.sh
          grep -Fx "94d051fccf7ce6e38da90112d18cb2bf3554769f $source_pin" "$workspace/.build/stamps/grease"
          runtime="$workspace/.build/grease/bin/grease"
          actual=$("$runtime" -c 'false ∨ echo canonical-grease')
          test "$actual" = canonical-grease
          if bash -c 'false ∨ echo canonical-grease' >/dev/null 2>&1; then
            echo 'the Grease identity probe accepted a substituted Bash runtime' >&2
            exit 1
          fi
          echo "GREASE=$runtime" >> "$GITHUB_ENV"
      - name: Exercise az under Grease defaults
        if: ${{ !cancelled() && steps.build_runtime.outcome == 'success' }}
        shell: bash
        run: AZ_SHELL="$GREASE" bash test/az-test.sh
      - name: Exercise abe under Grease defaults
        if: ${{ !cancelled() && steps.build_runtime.outcome == 'success' }}
        shell: bash
        run: AZ_SHELL="$GREASE" bash test/abe-test.sh
      - name: Exercise aa under Grease defaults
        if: ${{ !cancelled() && steps.build_runtime.outcome == 'success' }}
        shell: bash
        run: AZ_SHELL="$GREASE" bash test/aa-test.sh
